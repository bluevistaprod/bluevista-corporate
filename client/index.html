<!doctype html>
<!--
  L'attribut lang est réécrit au démarrage par client/src/main.tsx en fonction
  de la langue de l'URL (/ = fr, /en/ = en, /es/ = es). La valeur ci-dessous
  n'est que le repli servi avant l'exécution du script.
-->
<html lang="fr">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Bluevista Production — Agence vidéo, événementiel et immersion</title>
    <meta
      name="description"
      content="Bluevista conçoit et produit vos films, vos événements et vos expériences immersives depuis 2004. Studios à Lyon, Paris et Genève." />

    <!-- Optimisations de chargement -->
    <link rel="preconnect" href="https://player.vimeo.com" />
    <link rel="dns-prefetch" href="https://player.vimeo.com" />

    <!-- Ressources critiques -->
    <link rel="preload" as="style" href="/src/index.css" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
